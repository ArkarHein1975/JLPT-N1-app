<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>第3章 言い換える類義</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        /* 左なし・右なし */

        .control-buttons {
            text-align: center;
            margin-bottom: 25px;
        }

        .control-buttons button {
            padding: 8px 22px;
            margin: 0 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .control-buttons button.active {
            background-color: #333;
            color: white;
        }


        /* Table */

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px;
        }

        th {
            background-color: #eeeeee;
            text-align: center;
        }


        /* No. */

        .no {
            width: 7%;
            text-align: center;
        }


        /* Left / Right column */

        .word {
            width: 40%;
            text-align: center;
        }


        /* Arrow */

        .arrow {
            width: 6%;
            text-align: center;
            font-size: 25px;
        }


        /* Japanese */

        .japanese {
            font-size: 20px;
            font-weight: bold;
        }


        /* Hiragana */

        .hiragana {
            font-size: 14px;
            margin-top: 5px;
        }


        /* Translation */

        .translation {
            font-size: 15px;
            margin-top: 8px;
        }


        /* Hide data only */

        .hidden-data {
            visibility: hidden;
        }


        /* Pagination */

        .pagination {
            text-align: center;
            margin-top: 30px;
        }

        .pagination button {
            padding: 8px 18px;
            margin: 0 10px;
            cursor: pointer;
        }


        /* Home */

        .home-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 18px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>
</head>


<body>

    <h1>第3章</h1>

    <h2>言い換える類義</h2>


    <!-- 左なし・右なし -->

    <div class="control-buttons">

        <button id="leftButton"
                onclick="toggleLeft()">
            左なし
        </button>

        <button id="rightButton"
                onclick="toggleRight()">
            右なし
        </button>

    </div>


    <!-- Table -->

    <table>

        <thead>

            <tr>

                <th class="no">
                    No.
                </th>

                <th class="word">
                    漢字・ひらがな・翻訳
                </th>

                <th class="arrow">
                </th>

                <th class="word">
                    漢字・ひらがな・翻訳
                </th>

            </tr>

        </thead>


        <tbody>

            <tr th:each="word, stat : ${words}">

                <!-- No. -->

                <td class="no"
                    th:text="${currentPage * 9 + stat.count}">
                </td>


                <!-- Left -->

                <td class="word">

                    <div class="left-data">

                        <div class="japanese"
                             th:text="${word.word}">
                        </div>

                        <div class="hiragana"
                             th:text="${word.wordHiragana}">
                        </div>

                        <div class="translation"
                             th:text="${word.wordTranslation}">
                        </div>

                    </div>

                </td>


                <!-- Arrow -->

                <td class="arrow">
                    ⇔
                </td>


                <!-- Right -->

                <td class="word">

                    <div class="right-data">

                        <div class="japanese"
                             th:text="${word.synonym}">
                        </div>

                        <div class="hiragana"
                             th:text="${word.synonymHiragana}">
                        </div>

                        <div class="translation"
                             th:text="${word.synonymTranslation}">
                        </div>

                    </div>

                </td>

            </tr>

        </tbody>

    </table>


    <!-- Pagination -->

    <div class="pagination">

        <a th:if="${hasPrevious}"
           th:href="@{/chapter3(page=${currentPage - 1})}">

            <button>
                前へ
            </button>

        </a>


        <span>

            <span th:text="${currentPage + 1}">
            </span>

            /

            <span th:text="${totalPages}">
            </span>

        </span>


        <a th:if="${hasNext}"
           th:href="@{/chapter3(page=${currentPage + 1})}">

            <button>
                次へ
            </button>

        </a>

    </div>


    <!-- Home -->

    <a href="/category"
       class="home-button">
        Home
    </a>


    <!-- JavaScript -->

    <script>

        function toggleLeft() {

            const leftData =
                document.querySelectorAll(".left-data");

            const rightData =
                document.querySelectorAll(".right-data");

            const leftButton =
                document.getElementById("leftButton");

            const rightButton =
                document.getElementById("rightButton");


            /*
             * 左なし が ON の場合
             * → 左を表示
             */

            if (leftButton.classList.contains("active")) {

                leftData.forEach(function(data) {

                    data.classList.remove("hidden-data");

                });

                leftButton.classList.remove("active");

                return;
            }


            /*
             * 右なし が ON の場合
             * → 右を表示
             * → そのあと左を非表示
             */

            if (rightButton.classList.contains("active")) {

                rightData.forEach(function(data) {

                    data.classList.remove("hidden-data");

                });

                rightButton.classList.remove("active");
            }


            /*
             * 左ဘက် data ပဲ ဖျောက်
             */

            leftData.forEach(function(data) {

                data.classList.add("hidden-data");

            });

            leftButton.classList.add("active");
        }



        function toggleRight() {

            const leftData =
                document.querySelectorAll(".left-data");

            const rightData =
                document.querySelectorAll(".right-data");

            const leftButton =
                document.getElementById("leftButton");

            const rightButton =
                document.getElementById("rightButton");


            /*
             * 右なし が ON の場合
             * → 右ကို ပြန်ပြ
             */

            if (rightButton.classList.contains("active")) {

                rightData.forEach(function(data) {

                    data.classList.remove("hidden-data");

                });

                rightButton.classList.remove("active");

                return;
            }


            /*
             * 左なし が ON ဖြစ်နေရင်
             * → ဘယ်ဘက်ကို ပြန်ပြ
             * → ညာဘက်ကို ဖျောက်
             */

            if (leftButton.classList.contains("active")) {

                leftData.forEach(function(data) {

                    data.classList.remove("hidden-data");

                });

                leftButton.classList.remove("active");
            }


            /*
             * ညာဘက် data ပဲ ဖျောက်
             */

            rightData.forEach(function(data) {

                data.classList.add("hidden-data");

            });

            rightButton.classList.add("active");
        }

    </script>

</body>
</html>
