<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>第3章 言い換える類義</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            text-align: center;
            margin-bottom: 5px;
        }
        h2 {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 20px;
        }
        /* 左なし・右なし */
       /* 左なし・右なし */
.bottom-buttons {
    position: fixed;
    bottom: 75px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.control-button {
    width: 132px;
    padding: 10px 18px;
    background-color: #28a745;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}
.control-button.active {
    background-color: #333;
}
        /* Table */
        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #333;
            padding: 12px;
        }
        th {
            background-color: #eeeeee;
            text-align: center;
        }
        /* No. */
        .no {
            width: 7%;
            text-align: center;
        }
        /* Left / Right column */
        .word {
            width: 40%;
            text-align: center;
        }
        /* Arrow */
        .arrow {
            width: 6%;
            text-align: center;
            font-size: 25px;
        }
        /* Japanese */
        .japanese {
            font-size: 20px;
            font-weight: bold;
        }
        /* Hiragana */
        .hiragana {
            font-size: 14px;
            margin-top: 5px;
        }
        /* Translation */
        .translation {
            font-size: 15px;
            margin-top: 8px;
        }
        /* Hide data only */
        .hidden-data {
            visibility: hidden;
        }
        /* Pagination */
        .pagination {
            text-align: center;
            margin-top: 30px;
        }
        .pagination button {
            padding: 8px 18px;
            margin: 0 10px;
            cursor: pointer;
        }
.page-jump {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: white;
    padding: 10px 15px;
    border: 1px solid #ccc;
    border-radius: 10px;
    text-align: center;
    z-index: 1000;
}
.page-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 5px;
}
.page-number {
    margin-bottom: 5px;
}
.page-number select {
    padding: 4px 8px;
    font-size: 14px;
}
.page-jump button {
    padding: 5px 15px;
    cursor: pointer;
    font-size: 14px;
}
        /* Home */
        .home-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 18px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>第3章</h1>
    <h2>言い換える類義</h2>
    <!-- 左なし・右なし -->
    <div class="bottom-buttons">
    <button id="leftButton"
            class="control-button"
            onclick="toggleLeft()">
        左なし
    </button>
    <button id="rightButton"
            class="control-button"
            onclick="toggleRight()">
        右なし
    </button>
</div>
    <!-- Table -->
    <table>
        <thead>
            <tr>
                <th class="no">
                    No.
                </th>
                <th class="word">
                    漢字・ひらがな・翻訳
                </th>
                <th class="arrow">
                </th>
                <th class="word">
                    漢字・ひらがな・翻訳
                </th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="word, stat : ${words}">
                <!-- No. -->
                <td class="no"
                    th:text="${currentPage * 9 + stat.count}">
                </td>
                <!-- Left -->
                <td class="word">
                    <div class="left-data">
                        <div class="japanese"
                             th:text="${word.word}">
                        </div>
                        <div class="hiragana"
                             th:text="${word.wordHiragana}">
                        </div>
                        <div class="translation"
                             th:text="${word.wordTranslation}">
                        </div>
                    </div>
                </td>
                <!-- Arrow -->
                <td class="arrow">
                    ⇔
                </td>
                <!-- Right -->
                <td class="word">
                    <div class="right-data">
                        <div class="japanese"
                             th:text="${word.synonym}">
                        </div>
                        <div class="hiragana"
                             th:text="${word.synonymHiragana}">
                        </div>
                        <div class="translation"
                             th:text="${word.synonymTranslation}">
                        </div>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    <!-- Pagination -->
    <div class="pagination">
        <a th:if="${hasPrevious}"
           th:href="@{/chapter3(page=${currentPage - 1})}">
            <button>
                前へ
            </button>
        </a>
        <span>
            <span th:text="${currentPage + 1}">
            </span>
            <span th:text="${totalPages}">
            </span>
        </span>
        <a th:if="${hasNext}"
           th:href="@{/chapter3(page=${currentPage + 1})}">
            <button>
                次へ
            </button>
        </a>
    </div>
<!-- Page Jump -->
<div class="page-jump">
    <div class="page-title">
        Page
    </div>
    <div class="page-number">
        <select id="pageSelect">
            <option th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:value="${i - 1}"
                    th:text="${i}"
                    th:selected="${i - 1 == currentPage}">
            </option>
        </select>
        <span th:text="${totalPages}"></span>
    </div>
    <button onclick="goToPage()">
        移動
    </button>
</div>
    <!-- Home -->
    <a href="/category"
       class="home-button">
        Home
    </a>
    <!-- JavaScript -->
    <script>
        function toggleLeft() {
            const leftData =
                document.querySelectorAll(".left-data");
            const rightData =
                document.querySelectorAll(".right-data");
            const leftButton =
                document.getElementById("leftButton");
            const rightButton =
                document.getElementById("rightButton");
            /* 左なし が ON の場合 * → 左を表示*/
            if (leftButton.classList.contains("active")) {
                leftData.forEach(function(data) {
                    data.classList.remove("hidden-data");
                });
                leftButton.classList.remove("active");
                return;
            }
            /*右なし が ON の場合* → 右を表示* → そのあと左を非表示*/
            if (rightButton.classList.contains("active")) {
                rightData.forEach(function(data) {
                    data.classList.remove("hidden-data");
                });
                rightButton.classList.remove("active");
            }
            /* 左ဘက် data ပဲ ဖျောက်*/
            leftData.forEach(function(data) {
                data.classList.add("hidden-data");
            });
            leftButton.classList.add("active");
        }
        function toggleRight() {
            const leftData =
                document.querySelectorAll(".left-data");
            const rightData =
                document.querySelectorAll(".right-data");
            const leftButton =
                document.getElementById("leftButton");
            const rightButton =
                document.getElementById("rightButton");
            /* 右なし が ON の場合* → 右ကို ပြန်ပြ*/
            if (rightButton.classList.contains("active")) {
                rightData.forEach(function(data) {
                    data.classList.remove("hidden-data");
                });
                rightButton.classList.remove("active");
                return;
            }
            /*左なし が ON ဖြစ်နေရင်* → ဘယ်ဘက်ကို ပြန်ပြ* → ညာဘက်ကို ဖျောက်*/
            if (leftButton.classList.contains("active")) {
                leftData.forEach(function(data) {
                    data.classList.remove("hidden-data");
                });
                leftButton.classList.remove("active");
            }
            /*ညာဘက် data ပဲ ဖျောက်*/
            rightData.forEach(function(data) {
                data.classList.add("hidden-data");
            });
            rightButton.classList.add("active");
        }
        function goToPage() {
    const page =
        document.getElementById("pageSelect").value;
    window.location.href =
        "/chapter3?page=" + page;
}
    </script>
</body>
</html>
