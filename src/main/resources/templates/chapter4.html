<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>第4章 用法</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
        }

        th {
            background-color: #eeeeee;
            text-align: center;
        }

        .no {
            width: 7%;
            text-align: center;
        }

        .kanji {
            width: 18%;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .hiragana {
            width: 20%;
            text-align: center;
        }

        .translation {
            width: 25%;
            text-align: left;
        }

        /* Answer */

        .answer {
            display: none;
        }

        .answer.show {
            display: inline;
        }

        /* Example */

        .example {
            text-align: left;
            padding: 12px 15px;
            font-size: 16px;
            background-color: #fafafa;
        }

        /* Target word */

        .target-word {
            color: green;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
        }

        /* Pagination */

        .pagination {
            text-align: center;
            margin-top: 30px;
        }

        .pagination button {
            padding: 8px 18px;
            margin: 0 10px;
            cursor: pointer;
        }

        /* Home */

        .home-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 18px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>
</head>


<body>

    <h1>第4章</h1>

    <h2>用法</h2>


    <table>

        <thead>

            <tr>

                <th class="no">
                    No.
                </th>

                <th class="kanji">
                    漢字
                </th>

                <th class="hiragana">
                    ひらがな
                </th>

                <th class="translation">
                    翻訳
                </th>

            </tr>

        </thead>


        <tbody>

            <th:block th:each="word, stat : ${words}">

                <!-- Word -->

                <tr>

                    <!-- No. -->

                    <td class="no"
                        th:text="${currentPage * 10 + stat.count}">
                    </td>


                    <!-- Kanji -->

                    <td class="kanji"
                        th:text="${word.kanji != null
                                  and word.kanji != '-'
                                  and !#strings.isEmpty(word.kanji)
                                  ? word.kanji
                                  : word.hiragana}">
                    </td>


                    <!-- Hiragana -->

                    <td class="hiragana">

                        <span class="answer"
                              th:id="'hiragana-' + ${word.id}"
                              th:text="${word.hiragana}">
                        </span>

                    </td>


                    <!-- Translation -->

                    <td class="translation">

                        <span class="answer"
                              th:id="'translation-' + ${word.id}"
                              th:text="${word.translation}">
                        </span>

                    </td>

                </tr>


                <!-- Example -->

                <tr>

                    <td></td>

                    <td colspan="3"
                        class="example">

                        <span class="example-text"
                              th:attr="data-target=${
                                  word.targetWord != null
                                  and word.targetWord != '-'
                                  and !#strings.isEmpty(word.targetWord)
                                  ? word.targetWord
                                  : word.hiragana
                              },
                              data-id=${word.id}"
                              th:text="${word.example}">
                        </span>

                    </td>

                </tr>

            </th:block>

        </tbody>

    </table>


    <!-- Pagination -->

    <div class="pagination">

        <a th:if="${hasPrevious}"
           th:href="@{/chapter4(page=${currentPage - 1})}">

            <button>
                前へ
            </button>

        </a>


        <span>

            <span th:text="${currentPage + 1}">
            </span>

            /
            
            <span th:text="${totalPages}">
            </span>

        </span>


        <a th:if="${hasNext}"
           th:href="@{/chapter4(page=${currentPage + 1})}">

            <button>
                次へ
            </button>

        </a>

    </div>


    <!-- Home -->

    <a href="/category"
       class="home-button">
        Home
    </a>


    <!-- JavaScript -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const examples =
                document.querySelectorAll(".example-text");


            examples.forEach(function (element) {

                const target =
                    element.getAttribute("data-target");

                const id =
                    element.getAttribute("data-id");


                if (!target || target === "-") {
                    return;
                }


                const text =
                    element.textContent;


                const index =
                    text.indexOf(target);


                if (index === -1) {
                    return;
                }


                const before =
                    text.substring(0, index);


                const after =
                    text.substring(
                        index + target.length
                    );


                element.textContent = "";


                element.appendChild(
                    document.createTextNode(before)
                );


                const targetSpan =
                    document.createElement("span");


                targetSpan.className =
                    "target-word";


                targetSpan.textContent =
                    target;


                targetSpan.setAttribute(
                    "data-id",
                    id
                );


                targetSpan.onclick =
                    function () {
                        showAnswer(this);
                    };


                element.appendChild(
                    targetSpan
                );


                element.appendChild(
                    document.createTextNode(after)
                );

            });

        });


        function showAnswer(element) {

            const id =
                element.getAttribute("data-id");


            const hiragana =
                document.getElementById(
                    "hiragana-" + id
                );


            const translation =
                document.getElementById(
                    "translation-" + id
                );


            if (hiragana) {

                hiragana.classList.toggle("show");

            }


            if (translation) {

                translation.classList.toggle("show");

            }

        }

    </script>

</body>
</html>
