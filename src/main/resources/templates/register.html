<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ユーザー登録 | JLPT N1 学習</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .register-container {
            width: 380px;
            background-color: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;

            color: #333;

            margin-bottom: 30px;

            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: bold;
        }

        input {
            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #4CAF50;
        }

        .register-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background-color: #4CAF50;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .register-button:hover {
            background-color: #45a049;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;
        }

        .login-link a {
            color: #1976d2;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h1>ユーザー登録</h1>

        <form action="/register" method="post">

            <div class="form-group">

                <label for="name">
                    名前
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="名前を入力してください"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    メールアドレス
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="メールアドレスを入力してください"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    パスワード
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="パスワードを入力してください"
                    required>

            </div>


            <button
                type="submit"
                class="register-button">

                登録する

            </button>

        </form>


        <div class="login-link">

            すでにアカウントをお持ちですか？

            <a href="/user-login">
                ログイン
            </a>

        </div>

    </div>

</body>

</html>
