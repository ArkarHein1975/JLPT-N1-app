<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>第5章 オノマトペ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            text-align: center;
            margin-bottom: 5px;
        }
        h2 {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 30px;
        }
        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
        }
        th {
            background-color: #eeeeee;
            text-align: center;
        }
        .no {
            width: 8%;
            text-align: center;
        }
        .onomatopoeia {
            width: 42%;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .translation {
            width: 50%;
            text-align: center;
            font-size: 17px;
        }
        .translation-text {
            color: green;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .translation-text.hidden {
            color: transparent;
        }
        .pagination {
            text-align: center;
            margin-top: 30px;
        }
        .pagination button {
            padding: 8px 18px;
            margin: 0 10px;
            cursor: pointer;
        }
        .home-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 18px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>第5章</h1>
    <h2>オノマトペ</h2>
    <table>
        <thead>
            <tr>
                <th class="no">
                    No.
                </th>
                <th class="onomatopoeia">
                    オノマトペ
                </th>
                <th class="translation">
                    翻訳
                </th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="word, stat : ${words}">
                <!-- No. -->
                <td class="no"
                    th:text="${currentPage * 21 + stat.count}">
                </td>
                <!-- オノマトペ -->
                <td class="onomatopoeia"
                    th:text="${word.onomatopoeia}">
                </td>
                <!-- 翻訳 -->
                <td class="translation">
                    <span class="translation-text"
                          th:text="${word.translation}"
                          onclick="toggleTranslation(this)">
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
    <!-- Pagination -->
    <div class="pagination">
        <a th:if="${hasPrevious}"
           th:href="@{/chapter5(page=${currentPage - 1})}">
            <button>
                前へ
            </button>
        </a>
        <span>
            <span th:text="${currentPage + 1}">
            </span>
            <span th:text="${totalPages}">
            </span>
        </span>
        <a th:if="${hasNext}"
           th:href="@{/chapter5(page=${currentPage + 1})}">
            <button>
                次へ
            </button>
        </a>
    </div>
    <!-- Home -->
    <a href="/category"
       class="home-button">
        Home
    </a>
    <script>
        function toggleTranslation(element) {
            element.classList.toggle("hidden");
        }
    </script>
</body>
</html>
