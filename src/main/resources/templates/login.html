<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N1 学習</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }
        .start-container {
            width: 380px;
            background-color: white;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        h1 {
            margin-bottom: 40px;
            color: #333;
            font-size: 32px;
        }
        .start-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .start-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="start-container">
        <h1>JLPT N1 学習</h1>
        <a href="/category" class="start-button">
            勉強を始めましょう
        </a>
    </div>
</body>
</html>
